name: Build, Run, and Verify Logger Example (CMake)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-example-cmake:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: default
            cmake_args: ""
          - name: trace
            cmake_args: "-DLOG_LEVEL=TRACE"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake make g++ python3

      - name: Configure project with CMake (${{ matrix.name }})
        run: >
          cmake -S . -B build-cmake-${{ matrix.name }}
          -G "Unix Makefiles"
          ${{ matrix.cmake_args }}

      - name: Build project (${{ matrix.name }})
        run: cmake --build build-cmake-${{ matrix.name }} -- -j$(nproc)

      - name: Run the example (${{ matrix.name }})
        working-directory: build-cmake-${{ matrix.name }}/examples
        run: ./logger_example

      - name: Move output.log to repo root (${{ matrix.name }})
        run: mv build-cmake-${{ matrix.name }}/examples/output.log output-cmake-${{ matrix.name }}.log

      - name: Run verification script (${{ matrix.name }})
        run: python3 scripts/example_verification.py output-cmake-${{ matrix.name }}.log