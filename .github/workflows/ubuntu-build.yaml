name: Build, Run, and Verify Logger Example

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: default
            configure_args: ""
          - name: trace
            configure_args: "-Dlog_level=TRACE"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build g++ python3

      - name: Configure project with Meson (${{ matrix.name }})
        run: meson setup build-${{ matrix.name }} ${{ matrix.configure_args }}

      - name: Build project (${{ matrix.name }})
        run: meson compile -C build-${{ matrix.name }}

      - name: Run the example (${{ matrix.name }})
        working-directory: build-${{ matrix.name }}/examples
        run: ./logger_example

      - name: Move output.log to repo root (${{ matrix.name }})
        run: mv build-${{ matrix.name }}/examples/output.log output-${{ matrix.name }}.log

      - name: Run verification script (${{ matrix.name }})
        run: python3 scripts/example_verification.py output-${{ matrix.name }}.log